name: Build - Ubuntu Fast Release

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"
  push:
    branches:
      - mychanges
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Ubuntu 24.04 Release
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite;nugettimeout,600"
      VCPKG_NUGET_API_KEY: ${{ secrets.VCPKG_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Get vcpkg baseline
        shell: bash
        run: |
          vcpkgCommitId=$(grep '.builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')
          echo "VCPKG_GIT_COMMIT_ID=$vcpkgCommitId" >> "$GITHUB_ENV"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build gcc-14 g++-14
          sudo ln -sf /usr/bin/ninja /usr/bin/ninja-build
          ninja --version

      - name: CCache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          max-size: "1G"
          key: ccache-linux-fast-release
          restore-keys: |
            ccache-linux-fast
          create-symlink: true
      - name: Install mono for NuGet
        run: sudo apt-get update && sudo apt-get install -y mono-complete

      - name: Setup NuGet for vcpkg
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.VCPKG_PACKAGES_TOKEN || github.token }}
        run: |
          unset VCPKG_FORCE_SYSTEM_BINARIES
          NUGET_PATH=$(vcpkg fetch nuget | tail -n 1)
          mono "$NUGET_PATH" sources add \
            -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -storepasswordincleartext \
            -name "GitHubPackages" \
            -username "${{ github.repository_owner }}" \
            -password "${NUGET_AUTH_TOKEN}"
          mono "$NUGET_PATH" setapikey "${NUGET_AUTH_TOKEN}" \
            -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Debug vcpkg/cache paths (temporary)
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Environment ==="
          echo "VCPKG_ROOT=${VCPKG_ROOT:-<not-set>}"
          echo "VCPKG_INSTALLED_DIR(likely preset-defined) will be resolved during configure"
          echo "HOME=${HOME:-<not-set>}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<not-set>}"
          echo "PWD=$(pwd)"
          echo

          echo "=== Preset variable dump (linux-release) ==="
          # Prints all cache variables that CMake resolves (helps locate vcpkg dirs)
          cmake --preset linux-release -LAH | sed -n '/^-- Cache values/,/^-+$/p' || true
          echo

          echo "=== Listing ./vcpkg_installed (if present in repo workspace) ==="
          ls -la vcpkg_installed || true
          find vcpkg_installed -maxdepth 4 -type d 2>/dev/null || true
          echo

          echo "=== Listing common vcpkg cache candidates ==="
          if [ -n "${VCPKG_ROOT:-}" ] && [ -d "${VCPKG_ROOT:-}" ]; then
            ls -la "$VCPKG_ROOT" || true
            ls -la "$VCPKG_ROOT/binary-cache" || true
          fi
          ls -la "$HOME/.cache" || true
          find "$HOME" -maxdepth 3 -type d \( -name "vcpkg_installed" -o -name "binary-cache" -o -name "vcpkg" \) 2>/dev/null || true

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:

          configurePreset: linux-release
          buildPreset: linux-release
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON','-DVCPKG_INSTALL_OPTIONS=','-DCMAKE_C_COMPILER_LAUNCHER=ccache','-DCMAKE_CXX_COMPILER_LAUNCHER=ccache']"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-release-fast
          path: build/linux-release/bin/
