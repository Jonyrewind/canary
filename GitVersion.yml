mode: ContinuousDeployment

branches:
  mychanges:
    regex: ^mychanges$
    mode: ContinuousDeployment
    tag: ''
    increment: Minor
    source-branches:
      - canary_old
      - misc.-fixes,-additions

  canary_old:
    regex: ^canary_old$
    mode: ContinuousDeployment
    tag: ''
    increment: Minor
    source-branches: []

  misc.-fixes,-additions:
    regex: ^misc\.\-fixes,\-additions$
    mode: ContinuousDeployment
    tag: ''
    increment: Minor
    source-branches: []
